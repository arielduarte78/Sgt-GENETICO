[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kuramoto-templates"
version = "0.1.0"
description = "Auditable research framework for cluster templates in the homogeneous Kuramoto model on graphs."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "cvxpy==1.9.3",
    "clarabel==0.11.1",
    "mpmath==1.4.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "mypy==1.13.0",
    "ruff==0.7.4",
    "hypothesis>=6.120.0",
    "types-pyyaml>=6.0.12.20240917",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "C4",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
    "E501",
    "I001",
    "F401",
    "F541",
    "F841",
    "UP015",
    "B007",
    "B905",
    "E402",
    "W293",
    "F811",
]


[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.run_50gen_experiments"
ignore_errors = false


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "cited: pruebas de regresion contra literatura externa citada",
]

